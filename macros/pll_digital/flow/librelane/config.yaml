meta:
  version: 3
  flow: Classic
  substituting_steps:

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

    "+OpenROAD.DetailedRouting": "Odb.InsertECOBuffers"
    "+Odb.InsertECOBuffers": "OpenROAD.DetailedRouting"

INSERT_ECO_BUFFERS:
  # === East Pads ===
  # - target: output19/X # enable_i
  # buffer: sg13cmos5l_buf_4
  # === END OF ECO_BUFFERS ===
    
DESIGN_NAME: pll_digital
VERILOG_FILES:
  - dir::../../rtl/pfd.v
  - dir::../../rtl/fractional_divider.v
  - dir::../../rtl/clock_output_divider.v
  - dir::../../rtl/pll_digital.v

# Signed-off fixed full-rate TSPC /2. The portable RTL boundary is replaced
# through ihp_toggle_ff_map.v; no foundry cells appear in RTL.
EXTRA_VERILOG_MODELS:
  - dir::../../../pll_prescaler/models/pll_tspc_div23.v
MACROS:
  pll_tspc_div2:
    lef:
      - dir::../../../pll_prescaler/layout/pll_tspc_div2.lef
    gds:
      - dir::../../../pll_prescaler/layout/pll_tspc_div2.gds
    instances:
      "output_divider_i.div2_ff":
        location: [140, 25]
        orientation: N

# Enable plugin for better SystemVerilog support
# USE_SLANG: True

# The sg13cmos5l PDK already defaults to KLayout for GDS streamout
# PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# Layout / Floorplan Rules
DIE_AREA: [0, 0, 240, 210]
PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true
RUN_MAGIC_DRC: true
RUN_CTS: false

# The conventional dual-DFF PFD intentionally feeds UP & DOWN back into both
# asynchronous resets. Yosys reports those two RTL feedback paths as loops;
# after DFF mapping they are reset arcs and the final netlist check is clean.
ERROR_ON_SYNTH_CHECKS: false

# Valid values are AREA 0-3 and DELAY 0-4
# DELAY 4 = fastest, but largest area
# AREA 3 = slowest, but smallest area
SYNTH_STRATEGY: DELAY 4
# Keep the fixed /2 macro boundary hierarchical for physical implementation.
SYNTH_HIERARCHY_MODE: deferred_flatten
SYNTH_EXTRA_MAPPING_FILE: dir::ihp_toggle_ff_map.v
# MAX_FANOUT_CONSTRAINT: 6
# The hard-macro signal pins are vertical TopMetal1 rails. Keep signal routes
# below them so a horizontal TopMetal1 segment cannot short several rails.
RT_MAX_LAYER: Metal4
FP_PIN_ORDER_CFG: dir::pin_order.cfg
# Keep TopMetal1 free because the prescaler uses full-height signal rails on
# that layer. Its compact LEF exposes legal M4/TopMetal1 supply-via landings,
# allowing the single-layer M4 grid to connect the hard macros directly.
PDN_MULTILAYER: false
# The macro supply access is already on the M4 grid layer; do not ask pdngen
# to synthesize a second internal M4-to-TopMetal1 macro connection.
PDN_CONNECT_MACROS_TO_GRID: false
PDN_CFG: dir::pdn_cfg.tcl
FP_SIZING: absolute

# SDC files
PNR_SDC_FILE: dir::impl.sdc
SIGNOFF_SDC_FILE: dir::signoff.sdc

# Power / ground nets
VDD_NETS: ["VDD"]
GND_NETS: ["VSS"]
VERILOG_POWER_DEFINE: "USE_POWER_PINS"

# Clock
CLOCK_PORT: [ref_clk, vco_clk]
CLOCK_NET: [ref_clk, vco_clk]
CLOCK_PERIOD: 0.5 # ns; VCO input is the worst-case 2 GHz clock

# Define Standard Cells
STD_CELL_LIBRARY: sg13cmos5l_stdcell

# Technology LIBs
LIB:
  "*_fast_1p32V_m40C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_fast_1p32V_m40C.lib

  "*_fast_1p65V_m40C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_fast_1p65V_m40C.lib
  
  "*_slow_1p08V_125C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_slow_1p08V_125C.lib

  "*_slow_1p35V_125C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_slow_1p35V_125C.lib

  "*_typ_1p20V_25C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_typ_1p20V_25C.lib

  "*_typ_1p50V_25C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_typ_1p50V_25C.lib

# Corners
STA_CORNERS:
  - nom_fast_1p32V_m40C
  - nom_fast_1p65V_m40C
  - nom_slow_1p08V_125C
  - nom_slow_1p35V_125C
  - nom_typ_1p20V_25C
  - nom_typ_1p50V_25C

DEFAULT_CORNER: nom_slow_1p08V_125C

# Implement at the limiting voltage/temperature instead of meeting typical
# timing and leaving the slow-corner failures as nonfatal flow warnings.
PL_RESIZER_SETUP_SLACK_MARGIN: 0.05
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.05

# Fix hold violations
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05
PL_RESIZER_HOLD_SLACK_MARGIN: 0.1
PL_RESIZER_HOLD_MAX_BUFFER_PCT: 100
